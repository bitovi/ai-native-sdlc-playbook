<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDLC Overview Animation</title>
<style>
@font-face { font-family: "Poppins"; font-weight: 600; src: url(fonts/poppins-600.woff2) format("woff2"); }
@font-face { font-family: "Poppins"; font-weight: 700; src: url(fonts/poppins-700.woff2) format("woff2"); }
@font-face { font-family: "Poppins"; font-weight: 800; src: url(fonts/poppins-800.woff2) format("woff2"); }
@font-face { font-family: "Lato"; font-weight: 400; src: url(fonts/lato-400.woff2) format("woff2"); }
@font-face { font-family: "Lato"; font-weight: 700; src: url(fonts/lato-700.woff2) format("woff2"); }
@font-face { font-family: "Lato"; font-weight: 900; src: url(fonts/lato-900.woff2) format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url(fonts/jetbrainsmono-700.woff2) format("woff2"); }
html, body { margin: 0; background: #070d1f; color: #e2e8f0; font-family: Lato, sans-serif; }
canvas { display: block; width: 1280px; height: 720px; }
#ui { padding: 10px 16px; display: flex; gap: 12px; align-items: center; }
#ui input[type=range] { flex: 1; }
body.render #ui { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<div id="ui">
  <button id="play" type="button">Play</button>
  <input id="scrub" type="range" min="0" max="120" step="0.0333" value="0" aria-label="Time">
  <span id="time">0.00</span>
  <audio id="music" src="build/music.wav" preload="auto"></audio>
</div>
<script src="anim.js"></script>
<script>
(function () {
  if (/render=1/.test(location.search)) document.body.classList.add('render');
  var scrub = document.getElementById('scrub'), timeEl = document.getElementById('time');
  var play = document.getElementById('play'), music = document.getElementById('music');
  var playing = false, t0 = 0, start = 0;
  function show(t) { seek(t); scrub.value = t; timeEl.textContent = t.toFixed(2); }
  scrub.addEventListener('input', function () { show(+scrub.value); if (playing) { music.currentTime = +scrub.value; } });
  play.addEventListener('click', function () {
    playing = !playing; play.textContent = playing ? 'Pause' : 'Play';
    if (playing) { t0 = +scrub.value; start = performance.now(); music.currentTime = t0; music.play().catch(function () {}); requestAnimationFrame(loop); }
    else music.pause();
  });
  function loop(now) {
    if (!playing) return;
    var t = t0 + (now - start) / 1000;
    if (t > DUR) { playing = false; play.textContent = 'Play'; return; }
    show(t); requestAnimationFrame(loop);
  }
  document.fonts.ready.then(function () {
    return Promise.all(['600 20px Poppins', '700 20px Poppins', '800 20px Poppins', '400 20px Lato', '700 20px Lato', '900 20px Lato', '700 20px "JetBrains Mono"'].map(function (f) { return document.fonts.load(f); }));
  }).then(function () {
    var m = location.search.match(/t=([\d.]+)/);
    show(m ? +m[1] : 0);
    window.READY = true;
  });
})();
</script>
</body>
</html>
